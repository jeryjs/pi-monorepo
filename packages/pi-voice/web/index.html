<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pi Voice</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="bar">
    <span id="dot" class="dot"></span>
    <div class="grow">
      <div class="title">Pi Voice</div>
      <div id="sub" class="sub">connecting…</div>
    </div>
    <button id="end" class="ghost" title="Close this voice session">End</button>
  </header>

  <main class="body">
    <section id="log" class="log" aria-live="polite"></section>

    <section id="approval" class="approval hidden" aria-live="assertive">
      <div id="approvalText" class="approval-text"></div>
      <div class="approval-actions">
        <button id="deny" class="danger">Deny</button>
        <button id="allow" class="ok">Allow</button>
      </div>
    </section>

    <div id="notice" class="notice hidden"></div>
  </main>

  <footer class="foot">
    <div class="meter"><div id="level" class="level"></div></div>

    <div class="row">
      <button id="talk" class="primary">Start listening</button>
      <button id="mute" class="ghost" title="Mute the microphone">Mute</button>
      <button id="interrupt" class="ghost" title="Stop Pi talking">Shh</button>
    </div>

    <div class="row">
      <label class="toggle" title="Listen for the wake phrase all the time">
        <input id="alwaysOn" type="checkbox" />
        <span>Always-on wake word</span>
      </label>
      <span id="wakeState" class="chip">wake: off</span>
    </div>

    <form id="typeForm" class="row type">
      <input id="typeInput" type="text" placeholder="or type here…" autocomplete="off" />
      <button type="submit" class="ghost">Send</button>
    </form>

    <div id="stats" class="stats"></div>
  </footer>
</div>
<script type="module" src="voice.js"></script>
</body>
</html>
